# Business Type Sim — Hostinger KVM2 stack (alongside n8n).
# Ports default away from n8n (5678). Do not expose Postgres publicly.
name: businesstype-sim

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-businesstype}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-businesstype}
    volumes:
      - bt_pgdata:/var/lib/postgresql/data
    networks:
      - businesstype
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    # Host port optional for admin only — leave commented in production:
    # ports:
    #   - '5433:5432'

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER:-businesstype}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-businesstype}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://businesstypesim.raccoova.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://businesstypesim.raccoova.com}
      AUTH_DEV_CAPTURE: ${AUTH_DEV_CAPTURE:-0}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ollama.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-oss:120b}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-llama3.1:8b}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-25000}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AI_HOURLY_LIMIT: ${AI_HOURLY_LIMIT:-30}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - businesstype

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - '${WEB_PORT:-8088}:80'
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - businesstype
    labels:
      - traefik.enable=true
      - traefik.http.routers.businesstype.rule=Host(`${PUBLIC_HOST:-businesstypesim.raccoova.com}`)
      - traefik.http.routers.businesstype.entrypoints=websecure
      - traefik.http.routers.businesstype.tls.certresolver=letsencrypt
      - traefik.http.services.businesstype.loadbalancer.server.port=80

volumes:
  bt_pgdata:

networks:
  businesstype:
    name: businesstype-net
