# Deploy Business Type to Hostinger KVM2 via SSH + Docker Compose.
# Secrets checklist: docs/GITHUB_SECRETS.md — ops: docs/KVM2_OPS.md
name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  # Do not cancel an in-flight deploy (half-applied compose/migrations)
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run checks
      - name: Server typecheck
        working-directory: server
        run: npm ci && npm run typecheck

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "${VPS_SSH_KEY:-}" || { echo "Missing secret VPS_SSH_KEY"; exit 1; }
          test -n "${VPS_HOST:-}" || { echo "Missing secret VPS_HOST"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${VPS_SSH_PORT:-22}"
          # Fail closed if host key cannot be learned (avoid silent empty known_hosts)
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "ssh-keyscan produced empty known_hosts"; exit 1; }

      - name: Sync repo and restart stack
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          WEB_PORT: ${{ secrets.WEB_PORT }}
          PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_FALLBACK_MODEL: ${{ secrets.LLM_FALLBACK_MODEL }}
          LLM_TIMEOUT_MS: ${{ secrets.LLM_TIMEOUT_MS }}
          AI_HOURLY_LIMIT: ${{ secrets.AI_HOURLY_LIMIT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${VPS_SSH_PORT:-22}"
          USER_NAME="${VPS_USER:-}"
          DEPLOY_PATH="${VPS_DEPLOY_PATH:-}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"

          test -n "$USER_NAME" || { echo "Missing secret VPS_USER"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing secret VPS_DEPLOY_PATH"; exit 1; }

          # Validate required app secrets before touching the server
          test -n "${POSTGRES_PASSWORD:-}" || { echo "Missing secret POSTGRES_PASSWORD"; exit 1; }
          test -n "${JWT_SECRET:-}" || { echo "Missing secret JWT_SECRET"; exit 1; }
          test -n "${OLLAMA_API_KEY:-}" || { echo "Missing secret OLLAMA_API_KEY"; exit 1; }

          export POSTGRES_USER="${POSTGRES_USER:-businesstype}"
          export POSTGRES_DB="${POSTGRES_DB:-businesstype}"
          export VITE_API_URL="${VITE_API_URL:-/api}"
          export WEB_PORT="${WEB_PORT:-8088}"
          export PUBLIC_HOST="${PUBLIC_HOST:-businesstypesim.raccoova.com}"
          export CORS_ORIGIN="${CORS_ORIGIN:-https://businesstypesim.raccoova.com}"
          export PUBLIC_APP_URL="${PUBLIC_APP_URL:-$CORS_ORIGIN}"
          export COOKIE_SECURE="${COOKIE_SECURE:-true}"
          export LLM_BASE_URL="${LLM_BASE_URL:-https://ollama.com/v1}"
          export LLM_MODEL="${LLM_MODEL:-glm-5.3-flash:cloud}"
          export LLM_FALLBACK_MODEL="${LLM_FALLBACK_MODEL:-glm-5.3:cloud}"
          export LLM_TIMEOUT_MS="${LLM_TIMEOUT_MS:-25000}"
          export AI_HOURLY_LIMIT="${AI_HOURLY_LIMIT:-30}"
          export TAVILY_API_KEY="${TAVILY_API_KEY:-}"

          ENV_FILE="$(mktemp)"
          umask 077
          {
            echo "WEB_PORT=${WEB_PORT}"
            echo "VITE_API_URL=${VITE_API_URL}"
            echo "PUBLIC_HOST=${PUBLIC_HOST}"
            echo "POSTGRES_USER=${POSTGRES_USER}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "POSTGRES_DB=${POSTGRES_DB}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "CORS_ORIGIN=${CORS_ORIGIN}"
            echo "PUBLIC_APP_URL=${PUBLIC_APP_URL}"
            echo "COOKIE_SECURE=${COOKIE_SECURE}"
            echo "AUTH_DEV_CAPTURE=0"
            echo "OLLAMA_API_KEY=${OLLAMA_API_KEY}"
            echo "LLM_BASE_URL=${LLM_BASE_URL}"
            echo "LLM_MODEL=${LLM_MODEL}"
            echo "LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL}"
            echo "LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS}"
            echo "TAVILY_API_KEY=${TAVILY_API_KEY}"
            echo "AI_HOURLY_LIMIT=${AI_HOURLY_LIMIT}"
          } > "$ENV_FILE"

          SCP=(scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=yes)
          SSH=(ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes)

          "${SCP[@]}" "$ENV_FILE" "${USER_NAME}@${VPS_HOST}:/tmp/businesstype.deploy.env"
          rm -f "$ENV_FILE"

          "${SSH[@]}" "${USER_NAME}@${VPS_HOST}" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            REPO_URL="$REPO_URL" \
            GIT_SHA="$GITHUB_SHA" \
            bash -s <<'REMOTE'
          set -euo pipefail
          command -v docker >/dev/null || { echo "docker missing on VPS"; exit 1; }
          docker compose version >/dev/null || { echo "docker compose missing on VPS"; exit 1; }
          command -v curl >/dev/null || { echo "curl missing on VPS (needed for smoke-verify)"; exit 1; }

          mkdir -p "$DEPLOY_PATH" /var/backups/businesstype
          if [[ ! -d "$DEPLOY_PATH/.git" ]]; then
            git clone "$REPO_URL" "$DEPLOY_PATH"
          fi
          cd "$DEPLOY_PATH"
          git remote set-url origin "$REPO_URL"
          git fetch --depth 1 origin "$GIT_SHA"
          git checkout --force "$GIT_SHA"

          # Preserve VPS-only backup keys if present, then merge generated deploy env
          OPS_SNAP="$(mktemp)"
          if [[ -f deploy/.env ]]; then
            grep -E '^(BACKUP_|OFFSITE_)' deploy/.env >"$OPS_SNAP" || true
          fi
          install -m 600 /tmp/businesstype.deploy.env deploy/.env
          if [[ -s "$OPS_SNAP" ]]; then
            cat "$OPS_SNAP" >> deploy/.env
          fi
          rm -f /tmp/businesstype.deploy.env "$OPS_SNAP"

          chmod +x deploy/scripts/*.sh deploy/bootstrap-vps.sh 2>/dev/null || true

          cd deploy
          docker compose --env-file .env up -d --build
          # Wait for health when supported
          docker compose --env-file .env up -d --wait 2>/dev/null || sleep 20
          docker compose --env-file .env ps

          ./scripts/apply-migrations.sh
          ./scripts/smoke-verify.sh
          REMOTE
